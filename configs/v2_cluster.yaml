# Sarcasm-R1-Lite · v2 集群复跑配置
# 针对 2026-05-30 首跑(sarcasm_r1_88324)三大病灶的修正:
#   病因1 无 SFT 冷启动 → 格式奖励独大(accuracy_reward 均值 0.0)
#   病因2 分组无方差(frac_reward_zero_std≈0.6) → 大量步无学习信号
#   病因3 仅 200 步 → 训练远未收敛
# v2 修正:SFT 冷启动(另跑) + accuracy 奖励权重×3 主导 + G=6/温度1.0
#         增大组内方差 + 2 epoch(≈500 步) + 每 100 步存 checkpoint

model:
  # 集群本地模型缓存(免下载);llm-train/hf-models 下现有 0.5B
  name: "/lab/haoq_lab/cse12312606/llm-train/hf-models/qwen2.5-0.5b-instruct"
  max_length: 1024

data:
  source: "semeval"           # 与首跑同源,数字可比
  max_train_samples: 2862     # SemEval 2018 Task3 全量训练集
  max_eval_samples: 784       # 全量测试集
  test_size: 0.0

grpo:
  output_dir: "outputs/v2_grpo"
  num_generations: 6          # 4→6:降低零方差分组比例(24=3x8 可被 6 整除)
  learning_rate: 1.0e-5
  per_device_train_batch_size: 2   # 11GB 显存适配
  gradient_accumulation_steps: 12  # 每步 24 completions = 4 prompts x G=6
  num_train_epochs: 1         # ≈715 步(首跑仅 200 步)
  max_prompt_length: 256
  max_completion_length: 384
  temperature: 1.0            # 0.9→1.0:增大组内多样性
  beta: 0.04
  save_steps: 100             # 100..700 七个 checkpoint
  logging_steps: 10

eval:
  batch_size: 8
  max_new_tokens: 384

reward_weights:
  # v2 核心修正:正确性奖励主导,格式塑形交给 SFT 冷启动
  answer_correct: 3.0         # 1.0→3.0(首跑中该信号均值 0.0,被格式奖励淹没)
  format_valid: 0.3           # 维持小权重
  reasoning_present: 0.2      # 0.3→0.2
  reasoning_redundant: -0.1
  contradiction_penalty: -0.5

run:
  seed: 42
